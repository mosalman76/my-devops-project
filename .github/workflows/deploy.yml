name: Deploy Website to AWS EC2

on:
push:
branches:
- main

permissions:
contents: read

jobs:
deploy:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Validate website
    run: test -s index.html

  - name: Configure SSH
    env:
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
    run: |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh

      printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
      chmod 600 ~/.ssh/deploy_key

      printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
      chmod 600 ~/.ssh/known_hosts

  - name: Deploy website
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    run: |
      scp -i ~/.ssh/deploy_key \
        index.html \
        "$EC2_USER@$EC2_HOST:/tmp/index.html"

      ssh -i ~/.ssh/deploy_key \
        "$EC2_USER@$EC2_HOST" \
        'sudo install -o root -g root -m 644 /tmp/index.html /var/www/html/index.html && rm -f /tmp/index.html'
```
